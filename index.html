<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Jackelliny Ramos</title>
    <style>
        body {
            background-color: #3E5641; /* Verde Oliva/Folha */
            color: #F7F3F0; /* Off-white para contraste */
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #E6DED1; /* Areia */
            margin-bottom: 15px;
            object-fit: cover;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-align: center;
            color: #E6DED1;
        }

        p {
            font-size: 0.9rem;
            margin-bottom: 30px;
            text-align: center;
            opacity: 0.9;
            max-width: 300px;
        }

        .category-title {
            width: 100%;
            max-width: 400px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 5px;
            color: #D68C71; /* Argila */
            font-weight: bold;
        }

        .link-button {
            width: 100%;
            max-width: 400px;
            background-color: #E6DED1; /* Areia */
            color: #1B263B; /* Noite */
            text-decoration: none;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            box-sizing: border-box;
            transition: transform 0.2s, background-color 0.2s;
            display: block;
        }

        .link-button:hover {
            transform: scale(1.02);
            background-color: #D68C71; /* Muda para Argila no hover */
            color: white;
        }

        .secondary-button {
            background-color: transparent;
            border: 2px solid #E6DED1;
            color: #E6DED1;
        }
    </style>
</head>
<body>

    <img src="perfil.jpg" alt="Jackelliny Ramos" class="profile-pic">
    
    <h1>Jackelliny Ramos</h1>
    <p>ADS Student @FIAP | Maker | Dublin Alumni 🇮🇪</p>

    <div class="category-title">🛍️ Shopping & Curadoria</div>

    <a href="https://www.linkedin.com/in/jackellinyduraes" class="link-button secondary-button" target="_blank">LinkedIn Profissional</a>
    <a href="https://github.com/jackellinyduraes-dev" class="link-button secondary-button" target="_blank">Portfólio GitHub (ADS)</a>

    <div class="category-title">🌊 Lifestyle</div>
