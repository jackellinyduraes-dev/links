<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Jackelliny Durães </title>
    <style>
        body {
            background-color: #3E5641; /* Verde Oliva */
            color: #F7F3F0; 
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }
        .profile-pic {
            width: 120px; height: 120px;
            border-radius: 50%; border: 3px solid #E6DED1;
            margin-bottom: 15px; object-fit: cover;
        }
        .shein-card {
            background-color: #F7F3F0;
            color: #1B263B;
            width: 100%; max-width: 400px;
            padding: 20px; border-radius: 12px;
            margin-bottom: 20px; box-sizing: border-box;
            border-left: 8px solid #D68C71; /* Destaque Argila */
        }
        .code-box {
            background: #E6DED1;
            padding: 10px; border-radius: 5px;
            font-weight: bold; font-size: 1.2rem;
            text-align: center; margin: 10px 0;
            border: 1px dashed #3E5641;
            cursor: pointer;
        }
        .link-button {
            width: 100%; max-width: 400px;
            background-color: #E6DED1; color: #1B263B;
            text-decoration: none; padding: 15px;
            margin-bottom: 12px; border-radius: 8px;
            text-align: center; font-weight: 600;
            display: block; box-sizing: border-box;
        }
        .secondary-button {
            background-color: transparent;
            border: 2px solid #E6DED1; color: #E6DED1;
        }
    </style>
</head>
<body>

    <img src="perfil.jpg" alt="Jackelliny Ramos" class="profile-pic">
    
    <div class="shein-card">
        <strong style="color: #D68C71; font-size: 0.8rem; text-transform: uppercase;">🔥 SHEIN Especial</strong>
        <p style="margin: 5px 0; font-size: 0.9rem;">Pesquise meu código no App para ver minhas escolhas:</p>
        <div class="code-box" onclick="copyCode()">H99LC</div>
        <small style="font-size: 0.7rem; opacity: 0.7;">(Clique no código acima para copiar)</small>
    </div>

    <a href="https://shopee.com.br/prim3d" class="link-button"> Prim3D </a>
    <a href="https://www.tiktok.com/@jackieduraes" class="link-button"> TikTok</a>
    
    <div style="margin: 20px 0; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #D68C71;">Carreira & Lifestyle</div>
    <a href="https://www.linkedin.com/in/jackellinyduraes" class="link-button secondary-button">LinkedIn</a>
    <a href="https://instagram.com/jackellinyduraes" class="link-button secondary-button">Instagram</a>

    <script>
        function copyCode() {
            navigator.clipboard.writeText("H99LC");
            alert("Código H99LC copiado! Agora é só colar na busca do App SHEIN ✨");
        }
    </script>
</body>
</html>
